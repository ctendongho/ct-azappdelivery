# tasks file for ansible/roles/domain-controller

---
- name: Install Active Directory Domain Services
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    state: present

- name: Check whether Active Directory domain already exists
  ansible.windows.win_shell: |
    try {
      Import-Module ActiveDirectory
      (Get-ADDomain).DNSRoot
    }
    catch {
      exit 1
    }
  register: existing_domain
  changed_when: false
  failed_when: false

- name: Create Active Directory forest
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_domain_name }}"
    domain_netbios_name: "{{ ad_netbios_name }}"
    safe_mode_password: "{{ ad_safe_mode_password }}"
    install_dns: true
    reboot: true
  register: domain_install
  when: existing_domain.rc != 0

- name: Wait for Domain Controller to reboot
  ansible.builtin.wait_for_connection:
    delay: 30
    timeout: 900
  when:
    - domain_install is defined
    - domain_install.reboot_required | default(false)
