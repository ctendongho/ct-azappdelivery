---
- name: Grant CT Inventory application database permissions
  hosts: ct-azappsql01
  gather_facts: false

  tasks:
    - name: Ensure database user and role memberships exist
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = "Stop"

          Invoke-Sqlcmd `
            -ServerInstance localhost `
            -Database CTInvTracker `
            -QueryTimeout 0 `
            -Query "
            IF USER_ID(N'ctinventoryapp') IS NULL
            BEGIN
                CREATE USER [ctinventoryapp]
                FOR LOGIN [ctinventoryapp];
            END;

            IF NOT EXISTS (
                SELECT 1
                FROM sys.database_role_members AS drm
                JOIN sys.database_principals AS role_principal
                    ON drm.role_principal_id = role_principal.principal_id
                JOIN sys.database_principals AS member_principal
                    ON drm.member_principal_id = member_principal.principal_id
                WHERE role_principal.name = N'db_datareader'
                  AND member_principal.name = N'ctinventoryapp'
            )
            BEGIN
                ALTER ROLE [db_datareader]
                ADD MEMBER [ctinventoryapp];
            END;

            IF NOT EXISTS (
                SELECT 1
                FROM sys.database_role_members AS drm
                JOIN sys.database_principals AS role_principal
                    ON drm.role_principal_id = role_principal.principal_id
                JOIN sys.database_principals AS member_principal
                    ON drm.member_principal_id = member_principal.principal_id
                WHERE role_principal.name = N'db_datawriter'
                  AND member_principal.name = N'ctinventoryapp'
            )
            BEGIN
                ALTER ROLE [db_datawriter]
                ADD MEMBER [ctinventoryapp];
            END;
            "
