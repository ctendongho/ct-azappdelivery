---
- name: Create application inventory table
  hosts: ct-azappsql01
  gather_facts: false

  tasks:
    - name: Create dbo.InventoryItems
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = "Stop"

          Invoke-Sqlcmd `
            -ServerInstance localhost `
            -Database CTInvTracker `
            -Query "
            IF OBJECT_ID(N'dbo.InventoryItems', N'U') IS NULL
            BEGIN
                CREATE TABLE dbo.InventoryItems
                (
                    InventoryItemId INT IDENTITY(1,1) NOT NULL
                        CONSTRAINT PK_InventoryItems PRIMARY KEY,
                    ProductName NVARCHAR(150) NOT NULL,
                    Sku NVARCHAR(50) NOT NULL
                        CONSTRAINT UQ_InventoryItems_Sku UNIQUE,
                    Quantity INT NOT NULL
                        CONSTRAINT CK_InventoryItems_Quantity CHECK (Quantity >= 0),
                    UnitPrice DECIMAL(18,2) NOT NULL
                        CONSTRAINT CK_InventoryItems_UnitPrice CHECK (UnitPrice >= 0),
                    CreatedAtUtc DATETIME2(0) NOT NULL
                        CONSTRAINT DF_InventoryItems_CreatedAtUtc DEFAULT SYSUTCDATETIME(),
                    UpdatedAtUtc DATETIME2(0) NULL
                );
            END;
            "
